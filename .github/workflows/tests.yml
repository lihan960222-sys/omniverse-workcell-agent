name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Prepare temporary directory
        run: mkdir -p .work/temp
      - name: Install dependencies
        run: python -m pip install -c requirements.lock -e '.[usd,geometry,test]'
        env:
          TMPDIR: ${{ github.workspace }}/.work/temp
      - name: Check dependencies and source
        run: |
          python -m pip check
          python -m ruff check src tests scripts extensions
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Run OpenUSD and OCP tests
        run: python -m pytest tests --ignore=tests/isaac --junitxml=.work/core-tests.xml
        env:
          TMPDIR: ${{ github.workspace }}/.work/temp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-results
          path: .work/core-tests.xml
          if-no-files-found: ignore
