[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "omniverse-workcell-agent"
version = "0.1.0"
description = "Codex MCP tools and an Isaac Sim extension for workcell preparation and inspection"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=1.28,<2", "pydantic>=2.11,<3", "aiohttp>=3.12,<4",
  "httpx>=0.28,<1", "jinja2>=3.1,<4", "packaging>=24,<27"
]

[project.optional-dependencies]
usd = ["usd-core==25.11"]
geometry = ["cadquery-ocp==7.9.3.1.1"]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[project.scripts]
workcell-mcp = "workcell_agent.mcp_server:main"
workcell-check = "workcell_agent.environment:main"

[tool.hatch.build.targets.wheel]
packages = ["src/workcell_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "extensions", "skills", "scripts", "tests", "docs", "README.md",
           "pyproject.toml", "compatibility.json", "requirements.lock", "uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.work/pytest"
asyncio_mode = "auto"
markers = ["isaac: requires a running Isaac Sim application"]
norecursedirs = [".work", ".venv", "tests/isaac"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
